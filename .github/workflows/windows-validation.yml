name: Windows validation

on:
  push:
    branches:
      - main
      - fix/microphone-audio-to-transcript
      - fix/whisper-decoding-performance
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Synchronize frontend lockfile and install dependencies
        run: npm install --prefix frontend --no-audit --no-fund

      - name: Check Svelte and TypeScript
        run: npm run check --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test translation source-language segmentation
        run: python -m unittest discover -s src-tauri/tests -p "test_*.py"

      - name: Test real M2M100 translation model
        run: python src-tauri/tests/translation_smoke.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check translation Rust file formatting
        run: rustfmt --check --edition 2021 src-tauri/src/core/translation.rs

      - name: Run translation worker Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml core::translation::tests -- --nocapture
