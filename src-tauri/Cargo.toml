[package]
name = "voxy"
version = "0.1.0"
description = "VOXY — AI-Powered Multilingual Meeting Transcription"
authors = ["Tesseract Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "voxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voxy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri ──────────────────────────────────────────────────────────────────────
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"

# ── Async runtime ──────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Serialization ──────────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Logging / tracing ──────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# ── Error handling ─────────────────────────────────────────────────────────────
thiserror = "1"
anyhow = "1"

# ── Utilities ──────────────────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"

# ── Audio processing — Member 4 ───────────────────────────────────────────────
rubato = "0.16"

# ── Windows audio capture — Member 3 ──────────────────────────────────────────
wasapi = "0.14"

# ── Speech recognition — Member 5 ─────────────────────────────────────────────
# whisper-rs removed: using whisper.cpp CLI binary approach to avoid
# Windows MSVC + LLVM 23 bindgen incompatibility with whisper-rs-sys.

# ── Speaker analysis (VAD + diarization) — Member 6 ───────────────────────────
# sherpa-onnx provides Silero VAD and speaker embedding via ONNX Runtime.
#
# To enable real speaker diarization:
#   1. Add `--features sherpa` to your cargo build / tauri build command.
#   2. Download the ONNX embedding model and place it in models/:
#        3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx
#      (from https://github.com/k2-fsa/sherpa-onnx/releases)
#   3. Optionally download silero_vad.onnx for better VAD accuracy.
#
# Without this feature:
#   - EnergyVad (pure-Rust RMS gate) is used — no ONNX dependency.
#   - Speaker diarization is unavailable.
#   - `DiarizationEngine::is_active()` returns false.
#   - The pipeline reports "Speaker diarization unavailable" to the frontend.
#   - Transcription continues normally without speaker labels.
#
# Note: the 3dspeaker model was trained primarily on Mandarin. Its accuracy for
# Tamil and Sinhala speakers has not been evaluated. Alternative multilingual
# embedding models should be tested before production use.
sherpa-onnx = { version = "1", optional = true }

[features]
# This feature is used for production builds or when a dev server is not specified,
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Enable Silero VAD + sherpa-onnx speaker embeddings (Member 6 — speaker_analysis).
# Requires the ONNX model files to be present in the `models/` directory.
# See src-tauri/src/speaker_analysis/README.md for model download instructions.
sherpa = ["dep:sherpa-onnx"]

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = 3
lto = true
strip = true
