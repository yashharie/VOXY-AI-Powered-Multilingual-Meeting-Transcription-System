[package]
name = "voxy"
version = "0.1.0"
description = "VOXY — AI-Powered Multilingual Meeting Transcription"
authors = ["Tesseract Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "voxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voxy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri ──────────────────────────────────────────────────────────────────────
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"

# ── Async runtime ──────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Serialization ──────────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Logging / tracing ──────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# ── Error handling ─────────────────────────────────────────────────────────────
thiserror = "1"
anyhow = "1"

# ── Speech recognition ──────────────────────────────────────────────────────────
whisper-rs = { version = "0.16", features = ["tracing_backend"] }

# ── Utilities ──────────────────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"

[features]
# This feature is used for production builds or when a dev server is not specified,
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = 3
lto = true
strip = true
