[package]
name = "voxy"
version = "0.1.0"
description = "VOXY — AI-Powered Multilingual Meeting Transcription"
authors = ["Tesseract Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "voxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voxy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri ──────────────────────────────────────────────────────────────────────
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"

# ── Async runtime ──────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Serialization ──────────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Logging / tracing ──────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# ── Error handling ─────────────────────────────────────────────────────────────
thiserror = "1"
anyhow = "1"

# ── Utilities ──────────────────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"

# ── Speaker analysis (VAD + diarization) — Member 6 ───────────────────────────
# sherpa-onnx provides Silero VAD and speaker embedding via ONNX Runtime.
# Optional: compile with `--features sherpa` to enable real model inference.
# Without this feature the energy-based VAD fallback is used automatically.
sherpa-onnx = { version = "1", optional = true }

[features]
# This feature is used for production builds or when a dev server is not specified,
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Enable Silero VAD + sherpa-onnx speaker embeddings (Member 6 — speaker_analysis).
# Requires the ONNX model files to be present in the `models/` directory.
# See src-tauri/src/speaker_analysis/README.md for model download instructions.
sherpa = ["dep:sherpa-onnx"]

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = 3
lto = true
strip = true
